plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sh.apex.wallpaper'
    compileSdk 37

    defaultConfig {
        applicationId 'com.sh.apex.wallpaper'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
